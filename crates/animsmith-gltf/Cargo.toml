[package]
name = "animsmith-gltf"
description = "glTF/GLB ingestion into the animsmith core model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/animsmith-gltf"
readme = "README.md"
include.workspace = true
keywords.workspace = true
categories.workspace = true

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = ["aarch64-apple-darwin", "x86_64-pc-windows-msvc"]

[dependencies]
animsmith-core = { workspace = true }
gltf = { workspace = true }
base64 = { workspace = true }
glam = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
# Raw artifact proof compares parsed JSON values across a serialize/reload
# boundary, so every finite input number must round-trip to the same `f64`.
serde_json = { workspace = true, features = ["float_roundtrip"] }
image = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
animsmith-testkit = { path = "../animsmith-testkit" }
