[package]
name = "animsmith-report"
description = "Offline HTML reports for animsmith: judged skeleton playback, illustrative local-transform blending, and SVG metric charts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/animsmith-report"
readme = "README.md"
include.workspace = true
keywords.workspace = true
categories.workspace = true

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = ["aarch64-apple-darwin", "x86_64-pc-windows-msvc"]

[dependencies]
animsmith-core = { workspace = true }
base64 = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
animsmith-engine = { workspace = true }
animsmith-gltf = { workspace = true }
animsmith-testkit = { path = "../animsmith-testkit" }
tempfile = { workspace = true }
