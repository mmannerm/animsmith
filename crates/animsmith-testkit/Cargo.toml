[package]
name = "animsmith-testkit"
description = "Internal test support shared by animsmith's tests and the example asset generator: fixture builders, documentation-source readers, and CLI process helpers (not published)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# The `fixtures` feature exposes the shared analytic walk-cycle builder
# that the committed example assets wrap.
animsmith-core = { workspace = true, features = ["fixtures"] }
base64 = { workspace = true }
glam = { workspace = true }
# Pure-Rust libm: bit-identical trig across platforms. Passed into the
# fixtures builder as its sine so the committed example assets regenerate
# byte-for-byte on Linux / macOS / Windows.
libm = { workspace = true }
# The documentation gates read rendered Markdown, never source lines, so
# a code-shaped decoy cannot satisfy a promise.
pulldown-cmark = { workspace = true }
# The current-version documentation inventory reads the workspace manifest
# and the `tool` objects the output examples quote, so it parses both
# formats rather than pattern-matching version-shaped text; `glb_identity`
# reads a written GLB's JSON chunk back through the same parser, to find the
# release stamp it must digest around.
serde_json = { workspace = true }
toml = { workspace = true }

# `closed_stream` builds the CLI's reader-less output pipe between `fork`
# and `exec` in the spawned child, which needs the raw `pipe`/`dup2`/`close`
# calls rather than a safe wrapper that allocates or closes on drop.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
