<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>animsmith — walk.glb</title>
<style>/* animsmith report design tokens — the single colour authority for every
   generated report surface: CSS rules, Rust-rendered chart classes, and the
   WebGL/canvas pose views, which read these same custom properties.

   Three states, in cascade order:
     1. bare :root            — dark, the historical default look.
     2. prefers-color-scheme  — light, unless the document pins dark.
     3. [data-theme]          — an explicit `#theme=light|dark` fragment wins.

   Roles: ground = page/plot backdrop, surface = panel, raised = a row or
   control lifted off a panel, ink = body text, muted = secondary text and
   bone lines, line = borders and row hover, accent = headings, selection
   outline, left-side series and the hips trail,
   error = failing findings, playhead and the right-foot trail,
   warning = warning findings and the left-foot trail,
   pass = root trajectory, note = note findings and structural evidence. */
:root {
  /* The one type scale every chart label is drawn at, in the user units of
     a chart's own viewBox. Both stylesheets and the Rust chart renderer
     size their labels from this, so a panel and a chart beside it read at
     the same size whatever width their viewBox is scaled to. */
  --chart-type: 8px;
  --ground: #17171f;
  --surface: #1e1e2a;
  --raised: #232331;
  --ink: #d5d9e5;
  --muted: #9099b2;
  --line: #3a3a4e;
  --accent: #7aa2f7;
  --error: #f7768e;
  --warning: #e0af68;
  --pass: #9ece6a;
  --note: #bb9af7;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --ground: #f4f5f9;
    --surface: #ffffff;
    --raised: #eef0f6;
    --ink: #1a1e2c;
    --muted: #5b6382;
    --line: #d9deea;
    --accent: #3b67d6;
    --error: #cf3f5b;
    --warning: #946414;
    --pass: #287a3b;
    --note: #6b7390;
  }
}
:root[data-theme="light"] {
  --ground: #f4f5f9;
  --surface: #ffffff;
  --raised: #eef0f6;
  --ink: #1a1e2c;
  --muted: #5b6382;
  --line: #d9deea;
  --accent: #3b67d6;
  --error: #cf3f5b;
  --warning: #946414;
  --pass: #287a3b;
  --note: #6b7390;
}
/* Shared by both generated documents: the page ground, the evidence-row and
   notice surfaces, and the `#embed=1` chrome rules. Layout stays in
   viewer.css and comparison.css so this sheet says the same thing in both. */
* { box-sizing: border-box }
body { margin: 0; background: var(--ground); color: var(--ink); font: 14px/1.5 system-ui, sans-serif }
/* Evidence rows sit on --raised so they read as elements lifted off their
   panel rather than holes cut through it. */
.finding { background: var(--raised); border-radius: 5px; cursor: pointer }
.finding:hover { background: var(--line) }
.selected { outline: 2px solid var(--accent) }
.notice { background: var(--raised); border: 1px dashed var(--line); border-radius: 6px; color: var(--muted); padding: 2rem 1rem; text-align: center }
/* `#embed=1`: drop the running title and the interaction hint so the
   document sits inside an iframe without a second title bar or an outer
   margin. Findings, coverage, charts, identities, and both evidence
   disclosures stay: an embedded report must carry its own caveats. */
:root[data-embed] header, :root[data-embed] .hint { display: none }
:root[data-embed] main { padding: 0 }
/* Single-clip report layout. Colour lives in tokens.css and the shared
   surfaces in report-base.css; this sheet only places things. */
* { margin: 0; }
header { display: flex; gap: 1rem; align-items: baseline; padding: 0.7rem 1rem; }
header h1 { font-size: 1.05rem; color: var(--accent); }
#file { color: var(--muted); font-size: 0.85rem; }
main { display: grid; grid-template-columns: minmax(0, 3fr) minmax(280px, 2fr); gap: 1rem; padding: 0 1rem 1rem; }
@media (max-width: 900px) { main { grid-template-columns: 1fr; } }
section { background: var(--surface); border-radius: 8px; padding: 0.8rem; }
#controls { display: flex; gap: 0.6rem; align-items: center; margin-bottom: 0.6rem; }
#controls select, #controls button {
  background: var(--raised); color: var(--ink); border: 1px solid var(--line);
  border-radius: 5px; padding: 0.25rem 0.6rem; font: inherit; cursor: pointer;
}
#scrub { flex: 1; accent-color: var(--accent); }
#time { color: var(--muted); font-size: 0.8rem; white-space: nowrap; }
#gl { width: 100%; aspect-ratio: 4 / 3; border-radius: 6px; background: var(--ground); cursor: grab; }
.hint { color: var(--muted); font-size: 0.75rem; margin-top: 0.4rem; }
#side h2 { font-size: 0.9rem; color: var(--accent); margin: 0.4rem 0; }
#findings { list-style: none; max-height: 34vh; overflow-y: auto; }
.finding { padding: 0.4rem 0.5rem; margin-bottom: 0.3rem; font-size: 0.82rem; }
.finding .sev { font-weight: 600; margin-right: 0.4rem; text-transform: uppercase; font-size: 0.7rem; }
.finding.error .sev { color: var(--error); }
.finding.warning .sev { color: var(--warning); }
.finding.note .sev { color: var(--note); }
.finding code { color: var(--accent); }
.chart { margin-bottom: 0.7rem; }
.chart figcaption { color: var(--muted); font-size: 0.75rem; margin-bottom: 0.2rem; }
.chart svg { background: var(--ground); border-radius: 5px; }
/* Chart paint lives in these classes, never in per-element attributes, and
   the selectors stay unscoped, so a chart <svg> lifted out of the report
   keeps its meaning under an injected copy of these rules and tokens.css. */
.series-left, .series-right, .series-diff, .root-path { fill: none; stroke-width: 1.5; }
.series-left { stroke: var(--accent); }
.series-right { stroke: var(--warning); }
/* The difference series is read against its own right-hand axis, so it is
   dashed: a linear rescaling of an antiphase gait's L-R signal lands exactly
   on top of one foot curve, and a solid line there would simply disappear. */
.series-diff { stroke: var(--muted); stroke-dasharray: 4 3; }
.root-path { stroke: var(--pass); }
/* A gait group's members share one figure, so each one needs its own colour
   and its stride-anchor mark needs the same colour again: the mark says which
   curve entered the stride there. Six members is the whole series palette. */
.series-member-0, .series-member-1, .series-member-2,
.series-member-3, .series-member-4, .series-member-5 { fill: none; stroke-width: 1.5; }
.anchor-member-0, .anchor-member-1, .anchor-member-2,
.anchor-member-3, .anchor-member-4, .anchor-member-5 { stroke-width: 2.5; }
.series-member-0, .anchor-member-0 { stroke: var(--accent); }
.series-member-1, .anchor-member-1 { stroke: var(--warning); }
.series-member-2, .anchor-member-2 { stroke: var(--pass); }
.series-member-3, .anchor-member-3 { stroke: var(--note); }
.series-member-4, .anchor-member-4 { stroke: var(--error); }
.series-member-5, .anchor-member-5 { stroke: var(--muted); }
/* Members of a coherent group draw the same curve, so every one after the
   first would hide the ones under it. Each member's curve carries its own
   dash pattern as well as its own colour and the coincident ones interleave.
   Only the curves: a 14-unit anchor mark under `1 4` is three dots, and a
   10-unit legend swatch stops saying which colour it stands for. */
path.series-member-1 { stroke-dasharray: 7 4; }
path.series-member-2 { stroke-dasharray: 2 3; }
path.series-member-3 { stroke-dasharray: 12 5; }
path.series-member-4 { stroke-dasharray: 4 2 1 2; }
path.series-member-5 { stroke-dasharray: 1 4; }
/* The tolerance the group declares, drawn as a region rather than a line:
   the anchors inside it are the ones within the cap. It sits under every
   curve, so it is tinted rather than painted. */
.phase-band { fill: var(--pass); opacity: 0.16; }
/* Where a top-down track starts and where it ends, in the track's own
   colour: a hollow circle and a filled square, so a clip that walks out and
   never returns is not the same picture as one that comes back over its own
   line. The playhead dot keeps --error, so the current frame is never read
   as either end. */
.pathstart { fill: none; stroke: var(--pass); stroke-width: 1.5; }
/* The end square carries the plot's own ground as a stroke, so it still
   reads as a square where it lands on a dot or a line of its own colour. */
.pathend { fill: var(--pass); stroke: var(--ground); stroke-width: 1; }
.pathleader { fill: none; stroke: var(--pass); stroke-width: 1; }
.axis, .legend { fill: var(--muted); font-size: var(--chart-type); }
.playhead { stroke: var(--error); stroke-width: 1; }
.pathdot { fill: var(--error); }
</style>

<script>// animsmith report shared runtime — the pure helpers both generated viewers
// use. Kept in one asset so the single-clip and comparison documents cannot
// drift apart on theming or on how a URL fragment is read.
"use strict";

// The fallback palette used whenever a token cannot be resolved from the
// document. The report crate substitutes the dark values of tokens.css for
// this placeholder as it emits the runtime, so a token value is written in
// exactly one place; this asset is a template rather than standalone JS.
const ANIMSMITH_DEFAULT_PALETTE = {"accent":"#7aa2f7","error":"#f7768e","ground":"#17171f","ink":"#d5d9e5","line":"#3a3a4e","muted":"#9099b2","note":"#bb9af7","pass":"#9ece6a","raised":"#232331","surface":"#1e1e2a","warning":"#e0af68"};

// Live token values from the root element, so the WebGL and canvas pose views
// paint with the same palette as the CSS. Anything that is not an exact
// `#rrggbb` string — an old browser, a stripped stylesheet, an injected
// value — falls back to that token's dark default. Callers resolve this once
// per theme change rather than per frame.
function animsmithPalette() {
  const palette = Object.assign({}, ANIMSMITH_DEFAULT_PALETTE);
  const root = typeof document === "undefined" ? null : document.documentElement;
  const styles = root && typeof getComputedStyle === "function" ? getComputedStyle(root) : null;
  if (!styles) return palette;
  for (const name of Object.keys(palette)) {
    const value = String(styles.getPropertyValue("--" + name) || "").trim();
    if (/^#[0-9a-f]{6}$/i.test(value)) palette[name] = value.toLowerCase();
  }
  return palette;
}

// `#rrggbb` to the 0..1 RGB triple a WebGL vertex buffer carries.
function animsmithRgb(hex) {
  if (!/^#[0-9a-f]{6}$/i.test(String(hex))) return [0.5, 0.5, 0.5];
  return [1, 3, 5].map((offset) => parseInt(String(hex).slice(offset, offset + 2), 16) / 255);
}

// Bounded, total parser for a report's URL fragment: `&`-separated
// `key=value` pairs. `embed` strips the page chrome for an iframe, `theme`
// pins light or dark, and `clip`, `frame`, and `finding` are the deep-link
// selectors.
//
// Each option has three states, because a fragment is navigated as well as
// loaded: `undefined` when the key never appeared (leave that state alone),
// `null`/`false` when the value cannot be read at all (return that state to
// its default), and the value otherwise. A value that reads but overshoots is
// the caller's to place: a frame past the end of a clip is clamped to its last
// frame, not discarded, because a reader who asks for a position wants the
// nearest one the document can show.
// Unknown keys, pairs without a key, and malformed percent escapes are
// ignored rather than thrown, and the fragment is read but never written, so
// no fragment can raise an exception or drive a loop. The work is bounded by
// the length cap alone; every pair inside it is read. Whether a clip exists,
// how many frames it has, and how many findings there are is knowledge the
// caller holds, so the caller clamps against its own embedded data.
const ANIMSMITH_MAX_FRAGMENT_CHARS = 4096;

function animsmithFragmentOptions(hash) {
  const options = {};
  if (typeof hash !== "string" || hash.length > ANIMSMITH_MAX_FRAGMENT_CHARS) return options;
  const body = hash.charAt(0) === "#" ? hash.slice(1) : hash;
  for (const pair of body.split("&")) {
    const split = pair.indexOf("=");
    if (split < 1) continue;
    const value = pair.slice(split + 1);
    switch (pair.slice(0, split)) {
      case "embed": options.embed = value === "1" || value === "true"; break;
      case "theme": options.theme = value === "light" || value === "dark" ? value : null; break;
      case "clip": options.clip = animsmithDecoded(value); break;
      case "frame": options.frame = animsmithIndex(value); break;
      case "finding": options.finding = animsmithIndex(value); break;
      default: break;
    }
  }
  return options;
}

// A malformed percent escape is a discarded value, never a thrown URIError.
function animsmithDecoded(value) {
  try { return decodeURIComponent(value); } catch (error) { return null; }
}

// A non-negative decimal index. Digits beyond the float range become
// Infinity, which every caller clamps against its own frame or finding
// count, so no separate length rule is needed here.
function animsmithIndex(value) {
  return /^[0-9]+$/.test(value) ? Number(value) : null;
}

// Repaint hook for a reader who switches their system theme with the report
// open: the CSS follows on its own, the canvas views need the new palette.
function animsmithOnSchemeChange(repaint) {
  if (typeof matchMedia !== "function") return;
  const scheme = matchMedia("(prefers-color-scheme: light)");
  if (!scheme || typeof scheme.addEventListener !== "function") return;
  scheme.addEventListener("change", repaint);
}

// The two document-wide switches, applied to the root element so every visual
// consequence stays in the stylesheets. A fragment that does not mention a
// switch leaves it as it is — following a `#finding-…` anchor inside an
// embedded, theme-pinned report must not un-pin it — while an explicitly
// unusable value restores that switch's default.
function animsmithApplyDocument(options) {
  const root = typeof document === "undefined" ? null : document.documentElement;
  if (!root || typeof root.setAttribute !== "function") return options;
  if (options.theme !== undefined) {
    if (options.theme) root.setAttribute("data-theme", options.theme);
    else root.removeAttribute("data-theme");
  }
  if (options.embed !== undefined) {
    if (options.embed) root.setAttribute("data-embed", "1");
    else root.removeAttribute("data-embed");
  }
  return options;
}

// A frame loop with exactly one owner, for the transports both documents
// carry. Playback in either is nothing but advancing one number per frame,
// and both had the same defect: pausing left the callback it had scheduled
// alive, and playing scheduled another, so every pause-then-play added a
// redraw chain that ran for as long as the document stayed open.
//
// `stop` cancels the frame in flight, and the run number retires a callback
// the browser hands back anyway — a browser that ignores the cancellation
// still ends up with one loop, whether it was stopped or restarted.
function animsmithFrameLoop(advance) {
  const loop = { running: false, handle: 0, run: 0 };
  function chain(mine) {
    return function frame(now) {
      // Stopped, or retired by a later start: this chain ends here rather
      // than scheduling a successor.
      if (!loop.running || mine !== loop.run) return;
      advance(now);
      loop.handle = requestAnimationFrame(frame);
    };
  }
  return {
    get running() { return loop.running; },
    start() {
      loop.running = true;
      loop.run += 1;
      loop.handle = requestAnimationFrame(chain(loop.run));
    },
    // Returns false when it was already stopped, so a caller can tell a real
    // pause from a redundant one.
    stop() {
      if (!loop.running) return false;
      loop.running = false;
      if (loop.handle) {
        cancelAnimationFrame(loop.handle);
        loop.handle = 0;
      }
      return true;
    },
  };
}
</script>

<script>// animsmith report viewer — hand-written WebGL2 skeleton renderer.
// Renders exactly the pose-grid frames the checks judged; no animation
// sampling happens here.
"use strict";

const data = JSON.parse(document.getElementById("report-data").textContent);
// Theme and embed switches are applied before anything is measured or
// painted, and the palette is resolved once per theme change rather than per
// frame, so the 3D view always paints what the document shows.
animsmithApplyDocument(animsmithFragmentOptions(location.hash));
let palette = animsmithPalette();
document.getElementById("file").textContent =
  (data.file || "") + "  ·  rig profile: " + (data.profile || "none");

// ---- decode positions ------------------------------------------------
function decodePositions(b64) {
  const raw = atob(b64);
  const bytes = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
  return new Float32Array(bytes.buffer);
}
// The document itself says whether poses are available: an evidence-only
// report renders a notice in place of the canvas, so an absent canvas means
// there is nothing to decode, play back, or draw. Findings, coverage gaps,
// charts, and the source path are unchanged either way.
const canvas = document.getElementById("gl");
for (const clip of data.clips) clip.pos = canvas ? decodePositions(clip.positions) : null;

const boneCount = data.bones.length;
const parents = data.bones.map((b) => b.parent);

// ---- tiny mat4 -------------------------------------------------------
function perspective(fovy, aspect, near, far) {
  const f = 1 / Math.tan(fovy / 2), nf = 1 / (near - far);
  return [f / aspect, 0, 0, 0, 0, f, 0, 0, 0, 0, (far + near) * nf, -1,
          0, 0, 2 * far * near * nf, 0];
}
function lookAt(eye, at, up) {
  const z = norm3(sub3(eye, at));
  const x = norm3(cross3(up, z));
  const y = cross3(z, x);
  return [x[0], y[0], z[0], 0, x[1], y[1], z[1], 0, x[2], y[2], z[2], 0,
          -dot3(x, eye), -dot3(y, eye), -dot3(z, eye), 1];
}
function mul4(a, b) {
  const o = new Array(16).fill(0);
  for (let c = 0; c < 4; c++)
    for (let r = 0; r < 4; r++)
      for (let k = 0; k < 4; k++) o[c * 4 + r] += a[k * 4 + r] * b[c * 4 + k];
  return o;
}
const sub3 = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const dot3 = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross3 = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
function norm3(v) { const l = Math.hypot(...v) || 1; return [v[0] / l, v[1] / l, v[2] / l]; }

// ---- WebGL setup ------------------------------------------------------
const VS = `#version 300 es
layout(location=0) in vec3 pos;
layout(location=1) in vec3 color;
uniform mat4 mvp;
uniform float pointSize;
out vec3 vColor;
void main() { gl_Position = mvp * vec4(pos, 1.0); gl_PointSize = pointSize; vColor = color; }`;
const FS = `#version 300 es
precision mediump float;
in vec3 vColor;
out vec4 frag;
void main() { frag = vec4(vColor, 1.0); }`;
let gl = null, uMvp = null, uPointSize = null, vbo = null;
function shader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s);
  return s;
}
if (canvas) {
  gl = canvas.getContext("webgl2", { antialias: true });
  const prog = gl.createProgram();
  gl.attachShader(prog, shader(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  uMvp = gl.getUniformLocation(prog, "mvp");
  uPointSize = gl.getUniformLocation(prog, "pointSize");
  vbo = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  gl.enableVertexAttribArray(0);
  gl.enableVertexAttribArray(1);
  gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 24, 0);
  gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 24, 12);
  gl.enable(gl.DEPTH_TEST);
}

// ---- state ------------------------------------------------------------
let clip = data.clips[0] || null;
let frame = 0;
let yaw = 0.7, pitch = 0.35, dist = 0;
let center = [0, 1, 0];

function fitCamera() {
  if (!clip || !clip.pos) return;
  let min = [1e9, 1e9, 1e9], max = [-1e9, -1e9, -1e9];
  for (let i = 0; i < clip.pos.length; i += 3)
    for (let c = 0; c < 3; c++) {
      min[c] = Math.min(min[c], clip.pos[i + c]);
      max[c] = Math.max(max[c], clip.pos[i + c]);
    }
  center = [(min[0] + max[0]) / 2, (min[1] + max[1]) / 2, (min[2] + max[2]) / 2];
  dist = Math.max(max[0] - min[0], max[1] - min[1], max[2] - min[2], 0.5) * 1.8;
}

// Trail, bone, joint, and clear colours are the shared design tokens, so the
// 3D view follows the light/dark theme with the rest of the document.
const TRAIL_TOKENS = { root: "pass", hips: "accent", left_foot: "warning", right_foot: "error" };

function buildVertices(palette) {
  const boneColor = animsmithRgb(palette.muted);
  const jointColor = animsmithRgb(palette.ink);
  // interleaved pos+color: bone lines, joint points appended after.
  const verts = [];
  const f = Math.round(frame);
  const base = f * boneCount * 3;
  const p = (b) => [clip.pos[base + b * 3], clip.pos[base + b * 3 + 1], clip.pos[base + b * 3 + 2]];
  for (let b = 0; b < boneCount; b++) {
    if (parents[b] < 0) continue;
    verts.push(...p(parents[b]), ...boneColor, ...p(b), ...boneColor);
  }
  const lineVerts = verts.length / 6;
  for (let b = 0; b < boneCount; b++) verts.push(...p(b), ...jointColor);
  const pointVerts = boneCount;
  // trails: full path of tracked bones up to the current frame.
  let trailStart = lineVerts + pointVerts;
  const trailRanges = [];
  for (const [name, bone] of Object.entries(clip.trails || {})) {
    const color = animsmithRgb(palette[TRAIL_TOKENS[name]] || palette.muted);
    const start = verts.length / 6;
    for (let tf = 0; tf <= f; tf++) {
      const tb = tf * boneCount * 3 + bone * 3;
      verts.push(clip.pos[tb], clip.pos[tb + 1], clip.pos[tb + 2], ...color);
      if (tf > 0 && tf <= f - 0) {
        // line strip emulation: duplicate interior points for GL_LINES
        if (tf < f) {
          verts.push(clip.pos[tb], clip.pos[tb + 1], clip.pos[tb + 2], ...color);
        }
      }
    }
    trailRanges.push([start, verts.length / 6 - start]);
  }
  return { verts: new Float32Array(verts), lineVerts, pointVerts, trailStart, trailRanges };
}

function draw() {
  if (!clip || !gl) return;
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth * dpr, h = canvas.clientHeight * dpr;
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  gl.viewport(0, 0, w, h);
  const ground = animsmithRgb(palette.ground);
  gl.clearColor(ground[0], ground[1], ground[2], 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  const eye = [
    center[0] + dist * Math.cos(pitch) * Math.sin(yaw),
    center[1] + dist * Math.sin(pitch),
    center[2] + dist * Math.cos(pitch) * Math.cos(yaw),
  ];
  const mvp = mul4(perspective(0.9, w / h, 0.01, 100), lookAt(eye, center, [0, 1, 0]));
  gl.uniformMatrix4fv(uMvp, false, new Float32Array(mvp));

  const { verts, lineVerts, pointVerts, trailRanges } = buildVertices(palette);
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  gl.bufferData(gl.ARRAY_BUFFER, verts, gl.DYNAMIC_DRAW);
  gl.uniform1f(uPointSize, 5 * dpr);
  gl.drawArrays(gl.LINES, 0, lineVerts);
  gl.drawArrays(gl.POINTS, lineVerts, pointVerts);
  for (const [start, count] of trailRanges) gl.drawArrays(gl.LINE_STRIP, start, count);
}

// ---- UI ----------------------------------------------------------------
const clipSelect = document.getElementById("clip-select");
const scrub = document.getElementById("scrub");
const playBtn = document.getElementById("play");
const timeLabel = document.getElementById("time");

for (const c of data.clips) {
  const opt = document.createElement("option");
  opt.value = c.name;
  opt.textContent = c.name;
  clipSelect.appendChild(opt);
}

function selectClip(name) {
  clip = data.clips.find((c) => c.name === name) || data.clips[0];
  if (!clip) return;
  clipSelect.value = clip.name;
  scrub.max = clip.frames - 1;
  frame = Math.min(frame, clip.frames - 1);
  fitCamera();
  updateCharts();
  draw();
}

function setFrame(f) {
  if (!clip) return;
  frame = Math.max(0, Math.min(clip.frames - 1, f));
  scrub.value = Math.round(frame);
  const t = (frame / (clip.frames - 1)) * clip.duration;
  timeLabel.textContent = t.toFixed(3) + "s / " + clip.duration.toFixed(3) + "s (frame " +
    Math.round(frame) + ")";
  updateCharts();
  draw();
}

function updateCharts() {
  if (!clip) return;
  const u = clip.frames > 1 ? frame / (clip.frames - 1) : 0;
  // A group figure's axis is the stride cycle its members were measured on,
  // which excludes the duplicate wrap sample a longer grid repeats. The
  // clip figures' axis is the clip's own frames.
  const cycle = clip.cycle > 0 ? Math.min(1, frame / clip.cycle) : u;
  for (const fig of document.querySelectorAll(".chart")) {
    // A group figure draws every member of a declared gait group against the
    // others, so it stays visible while any member is selected — but only
    // then. Its caption describes its members' own source phase, so a clip
    // outside the group must not drive its playhead, and a figure of a group
    // the reader is not looking at is not evidence about the clip they are.
    const members = "members" in fig.dataset ? fig.dataset.members.split(",") : null;
    const active = members ? members.includes(clip.name) : fig.dataset.clip === clip.name;
    fig.style.display = active ? "" : "none";
    if (!active) continue;
    const playhead = fig.querySelector(".playhead");
    if (playhead) {
      const pad = parseFloat(fig.dataset.pad);
      const x = pad + parseFloat(fig.dataset.plotw) * (members ? cycle : u);
      playhead.setAttribute("x1", x);
      playhead.setAttribute("x2", x);
    }
    const dot = fig.querySelector(".pathdot");
    const points = fig.querySelector(".pathpoints");
    if (dot && points) {
      // One entry per judged frame, so the index is the frame. A frame the
      // clip has no sampled position for carries no coordinate, and the dot
      // is hidden for it rather than placed at some other frame's position.
      // The reader would otherwise be shown a place the character is not,
      // and before a leading gap, one it has not reached yet.
      const pts = points.innerHTML.split(";");
      const i = Math.min(pts.length - 1, Math.round(u * (pts.length - 1)));
      const at = pts[i].split(",");
      if (at.length === 2) {
        dot.setAttribute("cx", at[0]);
        dot.setAttribute("cy", at[1]);
        dot.removeAttribute("display");
      } else {
        dot.setAttribute("display", "none");
      }
    }
  }
}

clipSelect.addEventListener("change", () => { frame = 0; selectClip(clipSelect.value); });
scrub.addEventListener("input", () => { pausePlayback(); setFrame(+scrub.value); });

// The frame loop's ownership lives in the shared runtime, so both documents
// stop and restart playback the same way.
let last = 0;
const playLoop = animsmithFrameLoop((now) => {
  if (!clip) return;
  const dt = (now - last) / 1000;
  last = now;
  const fps = (clip.frames - 1) / clip.duration;
  let f = frame + dt * fps;
  if (f > clip.frames - 1) f = 0; // wrap like the runtime does
  setFrame(f);
});
function pausePlayback() {
  if (!playLoop.stop()) return;
  playBtn.textContent = "▶";
  playBtn.setAttribute("aria-label", "Play the clip");
}
playBtn.addEventListener("click", () => {
  if (!canvas) return;
  if (playLoop.running) { pausePlayback(); return; }
  last = performance.now();
  playLoop.start();
  playBtn.textContent = "⏸";
  playBtn.setAttribute("aria-label", "Pause the clip");
});

// orbit controls
let dragging = false, lastX = 0, lastY = 0;
if (canvas) {
  canvas.addEventListener("mousedown", (e) => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
  window.addEventListener("mouseup", () => (dragging = false));
  window.addEventListener("mousemove", (e) => {
    if (!dragging) return;
    yaw -= (e.clientX - lastX) * 0.01;
    pitch = Math.max(-1.4, Math.min(1.4, pitch + (e.clientY - lastY) * 0.01));
    lastX = e.clientX; lastY = e.clientY;
    draw();
  });
  canvas.addEventListener("wheel", (e) => {
    e.preventDefault();
    dist *= Math.exp(e.deltaY * 0.001);
    draw();
  }, { passive: false });
}

// findings panel
const list = document.getElementById("findings");
if (!data.findings.length) {
  const li = document.createElement("li");
  li.textContent = "clean — no findings";
  list.appendChild(li);
}
const findingItems = [];
// One selection path for a click and for a `#finding=` deep link: scrub to
// the judged frame and mark the row.
function selectFinding(index) {
  const f = data.findings[index], item = findingItems[index];
  for (const other of findingItems) other.classList.remove("selected");
  // An index this document cannot honour leaves nothing selected, which is
  // the default state, rather than keeping a previous selection.
  if (!f || !item) return;
  pausePlayback();
  item.classList.add("selected");
  if (item.scrollIntoView) item.scrollIntoView({ block: "nearest" });
  if (!f.clip) return;
  selectClip(f.clip);
  if (f.time != null && clip && clip.duration > 0)
    setFrame((f.time / clip.duration) * (clip.frames - 1));
}
data.findings.forEach((f, index) => {
  // Built with textContent throughout: clip/bone/node names and messages
  // come from the linted asset, i.e. untrusted input.
  const li = document.createElement("li");
  li.className = "finding " + f.severity;
  const add = (tag, cls, text) => {
    const el = document.createElement(tag);
    if (cls) el.className = cls;
    el.textContent = text;
    li.appendChild(el);
    return el;
  };
  add("span", "sev", f.severity);
  add("code", "", f.check);
  li.appendChild(document.createTextNode(" "));
  add("b", "", [f.clip, f.bone, f.node].filter(Boolean).join(" · "));
  if (f.time != null) li.appendChild(document.createTextNode(` @${f.time.toFixed(3)}s`));
  li.appendChild(document.createElement("br"));
  li.appendChild(document.createTextNode(f.message));
  li.addEventListener("click", () => selectFinding(index));
  findingItems.push(li);
  list.appendChild(li);
});

const gapList = document.getElementById("gaps");
if (!data.gaps.length) {
  const li = document.createElement("li");
  li.textContent = "none";
  gapList.appendChild(li);
}
for (const gap of data.gaps) {
  const li = document.createElement("li");
  const subject = gap.scope?.subject == null ? "" : ` · ${gap.scope.subject}`;
  const scope = gap.scope == null ? "" : ` · ${gap.scope.code}${subject}`;
  li.textContent = `${gap.check_id} · ${gap.code}${scope} — ${gap.message}`;
  gapList.appendChild(li);
}

// Prediction facets remain distinct from content findings and ordinary gaps.
const predictionList = document.getElementById("predictions");
if (!data.prediction_provenance) {
  const li = document.createElement("li");
  li.textContent = "engine-neutral — no profile resolved";
  predictionList.appendChild(li);
} else if (!data.predictions.length) {
  const li = document.createElement("li");
  const selection = data.prediction_provenance.profile.selection;
  li.textContent = `profile ${selection.family} revision ${selection.profile_revision} resolved; ` +
    "no engine-backed checks emitted predictions";
  predictionList.appendChild(li);
}
for (const row of data.predictions) {
  for (const facet of row.prediction.facets) {
    const li = document.createElement("li");
    li.className = "prediction " + facet.state;
    const subject = facet.scope.subject == null ? "" : ` · ${facet.scope.subject}`;
    const state = facet.state === "available"
      ? "available"
      : `required prediction unavailable: ${facet.reasons.join(", ")}`;
    li.textContent = `${row.check_id} · ${facet.scope.code}${subject} — ${state}`;
    predictionList.appendChild(li);
  }
}

// Fragment selection runs once the clip list, charts, and findings exist, so
// a deep link lands exactly where the equivalent click would. Each option that
// appears is applied in order — clip, then finding, then frame — as far as
// this document allows: setFrame clamps a frame past the end to the last
// judged frame, and a clip name the document does not carry selects the first
// clip. A value the parser could not read restores that state's default
// instead: frame 0, the first clip, no selected finding. An option that does
// not appear is left alone.
function applyFragment() {
  const options = animsmithApplyDocument(animsmithFragmentOptions(location.hash));
  palette = animsmithPalette();
  // A clip, a finding or a frame is a reader asking for one position, and a
  // running loop overwrites it on the very next frame. Only `theme` and
  // `embed` leave playback alone.
  if (options.clip !== undefined || options.finding !== undefined || options.frame !== undefined) pausePlayback();
  if (options.clip !== undefined && data.clips.length) {
    const known = data.clips.some((c) => c.name === options.clip);
    selectClip(known ? options.clip : data.clips[0].name);
    setFrame(0);
  }
  if (options.finding !== undefined) selectFinding(options.finding);
  if (options.frame !== undefined) setFrame(options.frame == null ? 0 : options.frame);
  draw();
}

window.addEventListener("resize", draw);
window.addEventListener("hashchange", applyFragment);
animsmithOnSchemeChange(() => { palette = animsmithPalette(); draw(); });
if (clip) { selectClip(clip.name); setFrame(0); }
applyFragment();
</script>
</body>
