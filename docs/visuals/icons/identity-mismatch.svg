<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Two different files each carrying a clip labelled with the same name">
  <title>Files disagree about skeleton or clip identity</title>
  <style>
    :root { --card: #b9c1d6; --ink: #3b67d6; --clash: #cf3f5b; }
    @media (prefers-color-scheme: dark) { :root { --card: #3d3d52; --ink: #7aa2f7; --clash: #f7768e; } }
    .card { fill: none; stroke: var(--card); stroke-width: 3; }
    .line { stroke: var(--ink); stroke-width: 4; stroke-linecap: round; }
    .tag { fill: var(--clash); }
    .clash { fill: none; stroke: var(--clash); stroke-width: 2.5; stroke-dasharray: 4 4; }
    .blink { animation: blink 2.2s ease-in-out infinite; }
    @keyframes blink { 0%, 100% { opacity: .4; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .blink { animation: none; opacity: 1; } }
  </style>
  <rect class="card" x="10" y="16" width="42" height="54" rx="6"/>
  <rect class="card" x="68" y="16" width="42" height="54" rx="6"/>
  <line class="line" x1="20" y1="30" x2="42" y2="30"/>
  <line class="line" x1="20" y1="42" x2="36" y2="42"/>
  <line class="line" x1="78" y1="30" x2="100" y2="30"/>
  <line class="line" x1="78" y1="42" x2="94" y2="42"/>
  <rect class="tag" x="16" y="56" width="30" height="8" rx="4"/>
  <rect class="tag" x="74" y="56" width="30" height="8" rx="4"/>
  <path class="clash blink" d="M31 78 C31 96 89 96 89 78"/>
  <circle class="tag blink" cx="60" cy="94" r="6"/>
</svg>
