<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Two stride cycles running around one ring a quarter turn out of phase with each other">
  <title>Feet skate when clips blend</title>
  <style>
    :root { --ring: #b9c1d6; --a: #3b67d6; --b: #cf3f5b; }
    @media (prefers-color-scheme: dark) { :root { --ring: #3d3d52; --a: #7aa2f7; --b: #f7768e; } }
    .ring { fill: none; stroke: var(--ring); stroke-width: 3; }
    .spread { fill: none; stroke: var(--b); stroke-width: 3; }
    .a { fill: var(--a); }
    .b { fill: var(--b); }
    .orbit { transform-origin: 60px 60px; animation: orbit 3.4s linear infinite; }
    .lag { transform-origin: 60px 60px; animation: orbit 3.4s linear infinite; }
    @keyframes orbit { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .orbit, .lag { animation: none; } }
  </style>
  <circle class="ring" cx="60" cy="60" r="42"/>
  <path class="spread" d="M60 18 A42 42 0 0 0 18 60"/>
  <g class="orbit"><circle class="a" cx="60" cy="18" r="7"/></g>
  <g class="lag"><circle class="b" cx="18" cy="60" r="7"/></g>
</svg>
