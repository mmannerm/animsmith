<svg xmlns="http://www.w3.org/2000/svg" id="icon-pose-flickers" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="A bone snaps the long way round between two keys instead of taking the short turn">
  <title>The pose flickers, spins, or explodes</title>
  <style>
    /* Every colour resolves through the documentation theme's own token,
       so an inlined icon follows the page's light or dark choice; the
       fallbacks are for a file opened on its own, where no token exists.
       Every rule is scoped to this icon's id, so nothing here reaches the
       page that inlines it or another picture beside it. */
    #icon-pose-flickers { --arc: var(--as-line-strong, #b9c1d6); --bone: var(--as-accent, #3b67d6); --bad: var(--as-error, #cf3f5b); }
    @media (prefers-color-scheme: dark) { #icon-pose-flickers { --arc: var(--as-line-strong, #3d3d52); --bone: var(--as-accent, #7aa2f7); --bad: var(--as-error, #f7768e); } }
    #icon-pose-flickers .arc { fill: none; stroke: var(--arc); stroke-width: 3; }
    #icon-pose-flickers .long { fill: none; stroke: var(--bad); stroke-width: 2.5; stroke-dasharray: 4 4; }
    #icon-pose-flickers .bone { stroke: var(--bone); stroke-width: 5; stroke-linecap: round; }
    #icon-pose-flickers .joint { fill: var(--bone); }
    #icon-pose-flickers .spin { transform-origin: 60px 92px; animation: spin 1.9s steps(2, jump-none) infinite; }
    @keyframes spin { from { transform: rotate(-52deg); } to { transform: rotate(52deg); } }
    @media (prefers-reduced-motion: reduce) { #icon-pose-flickers .spin { animation: none; transform: rotate(52deg); } }
  </style>
  <path class="arc" d="M18 92 A42 42 0 0 1 102 92"/>
  <path class="long" d="M27 116 A54 54 0 1 0 93 116"/>
  <g class="spin"><line class="bone" x1="60" y1="92" x2="60" y2="42"/></g>
  <circle class="joint" cx="60" cy="92" r="7"/>
</svg>
