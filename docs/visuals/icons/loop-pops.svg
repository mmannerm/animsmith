<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="A dot travelling around a ring jumps back at the seam every cycle">
  <title>The loop pops</title>
  <style>
    :root { --ring: #b9c1d6; --dot: #3b67d6; --seam: #cf3f5b; }
    @media (prefers-color-scheme: dark) { :root { --ring: #3d3d52; --dot: #7aa2f7; --seam: #f7768e; } }
    .ring { fill: none; stroke: var(--ring); stroke-width: 3; }
    .gap { fill: none; stroke: var(--seam); stroke-width: 3; stroke-dasharray: 4 4; }
    .seam { stroke: var(--seam); stroke-width: 2.5; }
    .dot { fill: var(--dot); }
    .orbit { transform-origin: 60px 60px; animation: orbit 2.6s linear infinite; }
    @keyframes orbit { from { transform: rotate(0deg); } to { transform: rotate(318deg); } }
    @media (prefers-reduced-motion: reduce) { .orbit { animation: none; transform: rotate(318deg); } }
  </style>
  <circle class="ring" cx="60" cy="60" r="44"/>
  <path class="gap" d="M60 16 A44 44 0 0 0 30.6 27.2"/>
  <line class="seam" x1="60" y1="10" x2="60" y2="22"/>
  <g class="orbit"><circle class="dot" cx="60" cy="16" r="6"/></g>
</svg>
