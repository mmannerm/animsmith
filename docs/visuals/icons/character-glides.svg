<svg xmlns="http://www.w3.org/2000/svg" id="icon-character-glides" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="A figure whose feet cycle on the spot while the whole body drifts sideways across the ground">
  <title>The character glides or runs in place</title>
  <style>
    /* Every colour resolves through the documentation theme's own token,
       so an inlined icon follows the page's light or dark choice; the
       fallbacks are for a file opened on its own, where no token exists.
       Every rule is scoped to this icon's id, so nothing here reaches the
       page that inlines it or another picture beside it. */
    #icon-character-glides { --ground: var(--as-line-strong, #b9c1d6); --body: var(--as-accent, #3b67d6); --drift: var(--as-error, #cf3f5b); }
    @media (prefers-color-scheme: dark) { #icon-character-glides { --ground: var(--as-line-strong, #3d3d52); --body: var(--as-accent, #7aa2f7); --drift: var(--as-error, #f7768e); } }
    #icon-character-glides .ground { stroke: var(--ground); stroke-width: 3; stroke-linecap: round; }
    #icon-character-glides .body { stroke: var(--body); stroke-width: 5; stroke-linecap: round; fill: none; }
    #icon-character-glides .head { fill: var(--body); }
    #icon-character-glides .drift { fill: none; stroke: var(--drift); stroke-width: 2.5; stroke-dasharray: 4 4; }
    #icon-character-glides .arrow { fill: var(--drift); }
    #icon-character-glides .glide { animation: glide 2.8s ease-in-out infinite; }
    @keyframes glide { 0%, 10% { transform: translateX(0); } 70%, 100% { transform: translateX(34px); } }
    @media (prefers-reduced-motion: reduce) { #icon-character-glides .glide { animation: none; transform: translateX(34px); } }
  </style>
  <line class="ground" x1="10" y1="96" x2="110" y2="96"/>
  <line class="drift" x1="34" y1="108" x2="92" y2="108"/>
  <path class="arrow" d="M92 103 L102 108 L92 113 Z"/>
  <g class="glide">
    <circle class="head" cx="34" cy="26" r="9"/>
    <line class="body" x1="34" y1="35" x2="34" y2="66"/>
    <path class="body" d="M34 66 L22 94"/>
    <path class="body" d="M34 66 L48 94"/>
  </g>
</svg>
