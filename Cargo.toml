[workspace]
resolver = "3"
members = [
    "crates/animsmith-core",
    "crates/animsmith-engine",
    "crates/animsmith-gltf",
    "crates/animsmith-fbx",
    "crates/animsmith-report",
    "crates/animsmith",
    "crates/animsmith-testkit",
]
# The exact Bevy probe has a Rust 1.95 toolchain requirement and owns a
# separate lock graph; it must never enter published-crate, docs.rs, or MSRV
# workspace resolution.
exclude = ["tools/bevy-readback"]

[workspace.package]
version = "0.11.1"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mmannerm/animsmith"
readme = "README.md"
include = [
    "src/**",
    "assets/**",
    "examples/**",
    "schemas/**",
    "tests/**",
    "testdata/**",
    "build.rs",
    "Cargo.toml",
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "THIRD-PARTY.md",
]
keywords = ["animation", "gltf", "lint", "gamedev", "fbx"]
categories = ["game-development", "graphics", "development-tools"]

[workspace.dependencies]
animsmith-core = { path = "crates/animsmith-core", version = "0.11.1" }
animsmith-engine = { path = "crates/animsmith-engine", version = "0.11.1" }
animsmith-gltf = { path = "crates/animsmith-gltf", version = "0.11.1" }
animsmith-fbx = { path = "crates/animsmith-fbx", version = "0.11.1" }
animsmith-report = { path = "crates/animsmith-report", version = "0.11.1" }
animsmith-testkit = { path = "crates/animsmith-testkit" }
ufbx = "0.11"
glam = { version = "0.33", features = ["scalar-math", "libm"] }
libm = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_jcs = "0.2"
jsonschema = { version = "0.52", default-features = false }
thiserror = "2"
gltf = { version = "1.4", default-features = false, features = ["utils", "names"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
pulldown-cmark = { version = "0.13", default-features = false }
base64 = "0.23"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
toml = "1.1"
tempfile = "3"
rustix = { version = "1.1", features = ["fs"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
sha2 = "0.11"
