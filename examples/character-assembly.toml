schema_version = 4
schema = "urn:animsmith:schema:character-assembly-recipe:4"
input_root = "inputs"
base_input = "base-character.fbx"
mesh_instances = ["character-mesh"]
remove_nodes = ["sword-placeholder"]
complete_tracks = true
canonicalize_skin = true
ground_and_center = true
# Opt in only after reviewing completed clips and transition behavior: pruning
# can remove completion-generated (bone, property) coverage that is not animated.
prune_constant_tracks = false
fps = 30.0

[[clips]]
name = "idle"
input = "idle.fbx"
take = "Take 001"
frame_window = [1, 61]
drop_closing_endpoint = true
strip_bones = ["motion-root"]

[[clips]]
name = "action"
input = "actions.fbx"
take = "Take 001"
frame_window = [91, 121]
hold_frames = 6
