# Contract for the deterministic synchronized-report acceptance pair.
# Both GLBs are generated by `gen_example_assets`; no external motion or
# commercial source contributes to either file.

[rig]
roles = { root = "root", hips = "hips", left_foot = "left_foot", right_foot = "right_foot" }

[clips.acceptance-matrix]
loop = true
speed_mps = { value = 1.0, tolerance = 0.1 }
movement_owner_xz = "gameplay"

[checks.loop-closure]
max_position_delta_m = 0.01
max_rotation_delta_deg = 1.0

[checks.foot-slide]
contact_height_m = 0.03
max_slide_mps = 0.3

# Keep this fixture focused on the comparison matrix rather than the separate
# endpoint-pruning workflow demonstrated by walk.glb.
[checks.duplicate-loop-endpoint]
severity = "off"
