# Configuration for the `typos` spell checker (see .github/workflows/typos.yml).
# Run locally with `just typos`.

[files]
# Binary DCC fixtures embed vendor strings we neither own nor can edit
# (e.g. an "Acuracy" property name baked into an FBX). Cargo.lock is
# machine-generated and full of crate names that read as misspellings.
extend-exclude = [
    "*.fbx",
    "*.glb",
    "Cargo.lock",
]

[default.extend-words]
# "ue-mannequin" is the built-in Unreal Engine rig profile.
ue = "ue"
# PBR material term surfaced by the ufbx material API (`pbr.metalness`).
metalness = "metalness"
# Level-of-detail abbreviation surfaced by the ufbx API (`lod_groups`).
lod = "lod"

[type.md]
# Keep exact vendor spellings in a complete single-backtick code span preceded
# only by a non-word, non-escape boundary (or start of input) and followed by the hidden
# `<!-- vendor-id -->` marker. The boundary prevents matching a suffix inside
# a multi-backtick delimiter. An identical spelling in ordinary prose remains
# subject to the normal typo check. The span cannot contain a backtick or CR/LF.
extend-ignore-re = [
    "(?:^|[^\\w`\\\\])`[^`\\r\\n]+`<!-- vendor-id -->",
]
