name: reusable checks

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo check --workspace --examples
      - run: cargo test --workspace
      - name: Golden skip marker
        run: bash scripts/check-golden-skip-marker.sh
      # The published binary must also build without the C dependency. Every
      # feature-variant build redirects CARGO_TARGET_DIR, so the conventional
      # target/debug and target/release paths keep the default-feature
      # artifacts the retained-CLI check below probes.
      - run: CARGO_TARGET_DIR=target/no-default-features cargo build -p animsmith --no-default-features
      - name: Build release binary
        run: cargo build -p animsmith --release
      - name: Build release binary without default features
        run: CARGO_TARGET_DIR=target/no-default-features cargo build -p animsmith --release --no-default-features
      - name: Prove the retained release CLI is the default-feature build
        run: bash scripts/check-release-cli.sh

  animation-pack:
    name: animation-pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install animation-pack validator dependency
        run: python -m pip install --disable-pip-version-check "PyYAML>=6,<7" "jsonschema>=4.18,<5"
      - name: Build checkout-matched AnimSmith validator
        run: cargo build -p animsmith --bin animsmith
      - name: Validate animation-pack skill and published reports
        run: ANIMSMITH_TEST_BINARY=target/debug/animsmith PYTHONDONTWRITEBYTECODE=1 python .agents/skills/evaluate-animation-packs/scripts/test_validators.py

  report-browser:
    name: generated report browser contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Execute both Rust-generated report viewers in the Node browser harness
        run: just report-browser

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve MSRV from Cargo.toml
        id: msrv
        run: |
          version="$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          test -n "$version" || { echo "no rust-version in Cargo.toml" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Action SHA is the `stable` branch; `toolchain` selects the MSRV.
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: msrv
      - run: cargo check --workspace --all-targets

  docs-package:
    name: docs and package
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install animation-pack validator dependency
        run: python -m pip install --disable-pip-version-check "PyYAML>=6,<7" "jsonschema>=4.18,<5"
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Verify output schema $id consistency
        run: scripts/check-schema-id.sh

      - name: Verify exact Bevy readback dependency graph
        run: bash scripts/check-bevy-readback-lock.sh

      - name: Validate GitHub community files
        run: bash scripts/check-github-community-files.sh

      - name: Rustdoc warnings and missing docs are errors
        env:
          RUSTDOCFLAGS: -D warnings -D missing_docs
        run: cargo doc --workspace --no-deps

      - name: Rustdoc warnings and missing docs are errors without default CLI features
        env:
          RUSTDOCFLAGS: -D warnings -D missing_docs
        run: CARGO_TARGET_DIR=target/no-default-features cargo doc -p animsmith --no-default-features --no-deps

      - name: CLI contract tests without default features
        run: CARGO_TARGET_DIR=target/no-default-features cargo test -p animsmith --test cli_contract --no-default-features

      - name: Foot-cycle producer CLI tests without default features
        run: CARGO_TARGET_DIR=target/no-default-features cargo test -p animsmith --test foot_cycle_cli --no-default-features

      - name: Mesh measurement tests without default features
        run: CARGO_TARGET_DIR=target/no-default-features cargo test -p animsmith --test measure_mesh --no-default-features

      - name: Scale producer CLI tests without default features
        run: CARGO_TARGET_DIR=target/no-default-features cargo test -p animsmith --test scale_cli --no-default-features

      - name: Check publishable crate package readiness
        run: bash scripts/check-package-inventory.sh

      - name: Install pinned release-plz history probe
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/release-plz/release-plz/releases/download/release-plz-v0.3.160/release-plz-x86_64-unknown-linux-gnu.tar.gz \
            --output "${RUNNER_TEMP}/release-plz.tar.gz"
          echo "2263c4f95eac1513da96a114a77fde20ea038742a8c8050f7514b8f93b828646  ${RUNNER_TEMP}/release-plz.tar.gz" \
            | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/release-plz.tar.gz" -C "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/release-plz" --version

      - name: Release binary packaging contract
        env:
          RELEASE_PLZ_BIN: ${{ runner.temp }}/release-plz
        run: bash scripts/check-release-packaging.sh
