name: reusable checks

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo check --workspace --examples
      - run: cargo test --workspace
      - name: Golden skip marker
        run: bash scripts/check-golden-skip-marker.sh
      # The published binary must also build without the C dependency.
      - run: cargo build -p animsmith --no-default-features
      - name: Build release binary
        run: cargo build -p animsmith --release
      - name: Smoke release binary
        run: cargo run -p animsmith --release -- --version
      - name: Build release binary without default features
        run: cargo build -p animsmith --release --no-default-features
      - name: Smoke release binary without default features
        run: cargo run -p animsmith --release --no-default-features -- --version

  animation-pack:
    name: animation-pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install animation-pack validator dependency
        run: python -m pip install --disable-pip-version-check "PyYAML>=6,<7" "jsonschema>=4.18,<5"
      - name: Build checkout-matched AnimSmith validator
        run: cargo build -p animsmith --bin animsmith
      - name: Validate animation-pack skill and published reports
        run: ANIMSMITH_TEST_BINARY=target/debug/animsmith PYTHONDONTWRITEBYTECODE=1 python .agents/skills/evaluate-animation-packs/scripts/test_validators.py

  report-browser:
    name: generated comparison browser contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Execute Rust-generated comparison in Node browser harness
        run: just report-browser

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve MSRV from Cargo.toml
        id: msrv
        run: |
          version="$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          test -n "$version" || { echo "no rust-version in Cargo.toml" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Action SHA is the `stable` branch; `toolchain` selects the MSRV.
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: msrv
      - run: cargo check --workspace --all-targets

  docs-package:
    name: docs and package
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install animation-pack validator dependency
        run: python -m pip install --disable-pip-version-check "PyYAML>=6,<7" "jsonschema>=4.18,<5"
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Verify output schema $id consistency
        run: scripts/check-schema-id.sh

      - name: Validate GitHub community files
        run: bash scripts/check-github-community-files.sh

      - name: Rustdoc warnings and missing docs are errors
        env:
          RUSTDOCFLAGS: -D warnings -D missing_docs
        run: cargo doc --workspace --no-deps

      - name: Rustdoc warnings and missing docs are errors without default CLI features
        env:
          RUSTDOCFLAGS: -D warnings -D missing_docs
        run: cargo doc -p animsmith --no-default-features --no-deps

      - name: CLI contract tests without default features
        run: cargo test -p animsmith --test cli_contract --no-default-features

      - name: Mesh measurement tests without default features
        run: cargo test -p animsmith --test measure_mesh --no-default-features

      - name: Scale producer CLI tests without default features
        run: cargo test -p animsmith --test scale_cli --no-default-features

      - name: Check publishable crate package readiness
        run: bash scripts/check-package-inventory.sh

      - name: Release binary packaging contract
        run: bash scripts/check-release-packaging.sh
