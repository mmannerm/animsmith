name: Pages documentation

on:
  pull_request:
  push:
    branches: [main]
  # Covers a release published by hand only: GitHub creates no workflow run
  # for a release created with the repository GITHUB_TOKEN, so release-plz.yml
  # dispatches this workflow after publishing instead (#652; see RELEASING.md,
  # "GitHub Pages documentation").
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: build Pages preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Install the pinned mdBook
        run: cargo install mdbook --version "$(tr -d '[:space:]' < .mdbook-version)" --locked
      - name: Build and validate the staged book
        env:
          ANIMSMITH_DOCS_STAGE: ${{ runner.temp }}/animsmith-docs-site
        run: just docs-check
      - name: Retain pull-request preview artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: pages-preview
          path: ${{ runner.temp }}/animsmith-docs-site/book
          if-no-files-found: error

  prepare-release-site:
    name: prepare release root and development site
    if: github.event_name != 'pull_request'
    needs: preview
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
      release_available: ${{ steps.release.outputs.available }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Select latest published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName --jq .tagName)"
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          eligibility="$(bash scripts/check-pages-release-eligibility.sh "$tag")"
          echo "$eligibility" >> "$GITHUB_OUTPUT"
          # A release without the pinned builder is skipped, never used to
          # manufacture a synthetic Pages root.
          if [ "$eligibility" = "available=true" ]; then
            git worktree add --detach ../animsmith-pages-release "$tag"
          fi
      - name: Install release and development mdBook pins
        if: steps.release.outputs.available == 'true'
        run: |
          set -euo pipefail
          install_mdbook() {
            local source="$1"
            local root="$2"
            local version
            version="$(tr -d '[:space:]' < "$source/.mdbook-version")"
            cargo install mdbook --version "$version" --locked --root "$root"
          }
          install_mdbook ../animsmith-pages-release "$RUNNER_TEMP/animsmith-pages-release-mdbook"
          install_mdbook . "$RUNNER_TEMP/animsmith-pages-development-mdbook"
      - name: Build the release root and main development subtree
        if: steps.release.outputs.available == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          python3 scripts/compose-pages-site.py \
            --release-source ../animsmith-pages-release --main-source . \
            --release-stage "$RUNNER_TEMP/animsmith-pages-release-stage" \
            --development-stage "$RUNNER_TEMP/animsmith-pages-development-stage" \
            --output "$RUNNER_TEMP/animsmith-pages-site" --release-tag "$RELEASE_TAG" \
            --release-mdbook "$RUNNER_TEMP/animsmith-pages-release-mdbook/bin/mdbook" \
            --development-mdbook "$RUNNER_TEMP/animsmith-pages-development-mdbook/bin/mdbook"
      - uses: actions/upload-pages-artifact@v5
        if: steps.release.outputs.available == 'true'
        with:
          path: ${{ runner.temp }}/animsmith-pages-site

  deploy:
    name: deploy Pages
    if: github.event_name != 'pull_request' && needs.prepare-release-site.outputs.release_available == 'true'
    needs: prepare-release-site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
