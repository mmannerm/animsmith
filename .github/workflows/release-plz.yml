name: release-plz

# Release automation via release-plz. Replaces the bespoke git-cliff
# version-computation + version-alignment flow removed from main.yml
# (see #37).
#
# Release automation has two deliberately separate trigger paths and two
# downstream publication jobs:
#   - workflow_dispatch: after the shared checks pass, release-pr opens/updates
#     a release PR that bumps the shared workspace version, propagates the
#     internal animsmith-* dependency versions, and updates CHANGELOG.md
#     (release-plz's Keep-a-Changelog format).
#   - push to main: release checks whether a merged release PR changed the
#     Cargo.toml version and, if so, tags, creates the GitHub Release, and
#     publishes all six crates to crates.io in dependency order.
#   - release-binaries: when release-plz reports a release for the CLI
#     package, calls release-binaries.yml to attach CLI archives and checksums
#     to that GitHub Release.
#   - release_pages: when release-plz reports a release, dispatches
#     docs-pages.yml on main so the Pages root moves to the tag just
#     published (see the job comment and RELEASING.md).
#
# crates.io publishing uses Trusted Publishing (GitHub OIDC): the release
# job holds `id-token: write` and release-plz mints a short-lived token
# itself — no CARGO_REGISTRY_TOKEN, no third-party auth/build action in
# the publish path.
#
# BOOTSTRAP (see RELEASING.md): Trusted Publishing cannot publish a crate
# that does not yet exist, so each crate's first published version is created
# manually once; TP takes over for every release afterwards.
#
# CI-on-release-PR caveat: PRs opened with the default GITHUB_TOKEN do
# not trigger `on: pull_request` workflows, so the release PR will not
# get a CI run on its own. If branch protection requires CI to merge it,
# swap `secrets.GITHUB_TOKEN` in the release-pr job for a PAT or GitHub
# App token (release-plz `token` input). Deferred to bootstrap.
# Repository prerequisite (see RELEASING.md): Settings → Actions → General →
# Workflow permissions must allow GitHub Actions to create and approve pull
# requests. The job-level `pull-requests: write` permission below does not
# override that setting.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Post-merge test gate — also the safety re-run that used to live in
  # main.yml. Publishing waits on this.
  checks:
    permissions:
      contents: read # checkout for the reusable test matrix
    uses: ./.github/workflows/checks.yml

  release:
    name: release-plz release
    needs: [checks]
    # Inert until the one-time bootstrap arms it (see RELEASING.md). Before
    # the first manual publish + Trusted Publishing setup, an armed job would
    # try to publish the not-yet-existing 0.1.0 crates on every main push and
    # fail. Arm with: gh variable set RELEASE_PLZ_ARMED --body true
    if: ${{ github.event_name == 'push' && vars.RELEASE_PLZ_ARMED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # push tags + create GitHub Releases
      pull-requests: read
      id-token: write # OIDC handshake with crates.io (Trusted Publishing)
    outputs:
      releases_created: ${{ steps.release_plz.outputs.releases_created }}
      release_tag: ${{ steps.release_metadata.outputs.release_tag }}
    # This job mints a crates.io token (id-token: write), so its actions are
    # SHA-pinned to remove the moving-ref exposure a tag like @stable carries.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - name: Run release-plz
        id: release_plz
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Select CLI release tag
        id: release_metadata
        env:
          RELEASES_CREATED: ${{ steps.release_plz.outputs.releases_created }}
          RELEASES: ${{ steps.release_plz.outputs.releases }}
        run: |
          set -euo pipefail
          tag="$(scripts/select-cli-release-tag.sh)"
          echo "release_tag=${tag}" >> "${GITHUB_OUTPUT}"

  release_binaries:
    name: release binaries
    needs: [release]
    if: ${{ needs.release.outputs.releases_created == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/release-binaries.yml
    with:
      tag: ${{ needs.release.outputs.release_tag }}

  # GitHub creates no workflow run for an event produced with the repository
  # GITHUB_TOKEN, so the `release: published` trigger in docs-pages.yml never
  # fires for the release published above, leaving the Pages root on the
  # previous tag (#652). workflow_dispatch is one of the two documented
  # exceptions to that recursion guard, so the publication dispatches Pages
  # itself with the same token — no personal access token is involved.
  # The push that merged the release PR already started a Pages run against the
  # previous tag; docs-pages.yml's `pages-<ref>` concurrency group cancels that
  # older run, so this post-publication composition is the one that deploys.
  release_pages:
    name: dispatch Pages documentation
    needs: [release]
    if: ${{ needs.release.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write # dispatch docs-pages.yml on main
    steps:
      - name: Dispatch the Pages documentation workflow on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs-pages.yml --ref main --repo "${GITHUB_REPOSITORY}"

  release-pr:
    name: release-plz release-pr
    needs: [checks]
    # Also gated on the bootstrap arming variable: before the first
    # manual v0.1.0 release there is no baseline tag, so an ungated manual
    # dispatch would open a spurious release PR. After arming, this job still
    # runs only when a maintainer explicitly dispatches the workflow.
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.RELEASE_PLZ_ARMED == 'true' }}
    runs-on: ubuntu-latest
    # Never cancel a half-written release PR.
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write # push the release branch
      pull-requests: write # open/update the release PR
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      # release-plz packages each package-changing historical tree while it
      # searches for the registry baseline. Keep the full commit/changelog
      # range while making one known transient merge tree parseable locally.
      # The exact-object guard refuses any drift, and refs/replace is never
      # pushed or used by the publication jobs.
      - name: Prepare parseable release-plz history
        id: history_prepare
        run: bash scripts/prepare-release-plz-history.sh
      - name: Run release-plz
        id: release_plz
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release-pr
          version: 0.3.160
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove local release-plz history preparation
        if: ${{ always() && steps.history_prepare.outcome == 'success' }}
        run: bash scripts/prepare-release-plz-history.sh --remove
      # The default GITHUB_TOKEN does not trigger pull_request workflows for
      # the bot-created PR. Check the generated branch here so a mismatched
      # release version can never hide behind that GitHub recursion guard.
      - name: Checkout generated release branch
        if: ${{ steps.release_plz.outputs.prs_created == 'true' }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ fromJSON(steps.release_plz.outputs.pr).head_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify generated release version documentation
        if: ${{ steps.release_plz.outputs.prs_created == 'true' }}
        env:
          ANIMSMITH_RELEASE_PR: "true"
        run: cargo test -p animsmith --test release_version_docs
